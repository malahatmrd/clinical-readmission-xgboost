random_seed: 42

baseline:
  model: logistic_regression
  max_iter: 2000

xgboost:
  objective: binary:logistic
  eval_metric: aucpr
  n_estimators: 2000
  learning_rate: 0.03
  max_depth: 5
  min_child_weight: 3
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  n_jobs: -1
