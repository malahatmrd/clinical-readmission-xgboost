[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "clinical-readmission-xgboost"
version = "1.0.0"
description = "Leakage-aware and reproducible 30-day hospital readmission prediction with XGBoost."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

authors = [
    { name = "malahatmrd" }
]

keywords = [
    "clinical-machine-learning",
    "medical-ai",
    "readmission-prediction",
    "xgboost",
    "probability-calibration",
    "explainable-ai",
    "shap",
    "reproducible-research",
]

dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "xgboost==3.4.0",
    "shap==0.52.0",
    "matplotlib==3.11.1",
    "PyYAML==6.0.3",
    "joblib==1.5.3",
    "ucimlrepo==0.0.7",
]


[project.urls]
Homepage = "https://github.com/malahatmrd/clinical-readmission-xgboost"
Repository = "https://github.com/malahatmrd/clinical-readmission-xgboost"
Documentation = "https://github.com/malahatmrd/clinical-readmission-xgboost/tree/main/docs"
Issues = "https://github.com/malahatmrd/clinical-readmission-xgboost/issues"


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "I", "B"]